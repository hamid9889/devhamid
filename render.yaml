services:
  - type: web
    name: devhamid-portfolio-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: TARGET_EMAIL
        value: 8090hamid@gmail.com
      - key: GITHUB_USERNAME
        value: hamid9889
      - key: GITHUB_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://devhamid.vercel.app
